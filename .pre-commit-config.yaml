default_install_hook_types: [commit-msg]

repos:
  - repo: local
    hooks:
      - id: commit-msg-guardian
        name: commit-msg-guardian (Conventional Commits, English)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        types: [file]
        pass_filenames: true
        always_run: true
